    function submitInstituteLogin(e) {
      e.preventDefault();
      const code = (document.getElementById('instLoginCodeInput')?.value || '').trim().toUpperCase();
      const pin = (document.getElementById('instLoginPinInput')?.value || '').trim();

      const inst = appState.institutes.find(i => i.code.toUpperCase() === code || i.id.toUpperCase() === code);
      if (!inst) {
        showToast('Institute Code not found. Contact WhatsApp: 7799199452 for access.', 'error');
        return;
      }
      if (inst.status === 'suspended') {
        showToast('This institute portal is paused. Contact WhatsApp: 7799199452.', 'error');
        return;
      }
      if (pin !== inst.pin) {
        showToast('Incorrect 4-digit PIN. Contact WhatsApp: 7799199452 if forgotten.', 'error');
        return;
      }

      session.loggedInInstId = inst.id;
      session.loginCodeInput = '';
      session.role = 'institute';
      session.instTab = 'overview';
      saveAppState();
      showToast(`Logged into ${inst.name}`, 'success');
      renderRoot();
    }
