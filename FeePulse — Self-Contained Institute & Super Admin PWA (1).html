<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>FeePulse — Institute Fee &amp; Attendance Portal</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #f59e0b;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #059669;
      --success-bg: #ecfdf5;
      --warn: #d97706;
      --warn-bg: #fffbeb;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .container { max-width: 840px; margin: 0 auto; padding: 12px 12px 88px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .wrap { flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (max-width: 560px) {
      .grid-3 { grid-template-columns: 1fr; }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #e2e8f0;
      color: #334155;
    }
    .badge-green { background: var(--success-bg); color: var(--success); }
    .badge-red { background: var(--danger-bg); color: var(--danger); }
    .badge-amber { background: var(--warn-bg); color: var(--warn); }
    .badge-blue { background: #eff6ff; color: #1d4ed8; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
    .btn-block { width: 100%; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-dark { background: #0f172a; color: #fff; }
    .btn-wa { background: #16a34a; color: #fff; }
    .btn-blast { background: linear-gradient(135deg, #059669 0%, #0f766e 100%); color: #fff; box-shadow: 0 2px 8px rgba(5, 150, 105, 0.28); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: #fecaca; }
    .btn-outline { background: #fff; color: #1e293b; border-color: #cbd5e1; }
    .btn-ghost { background: #f8fafc; color: #334155; border-color: #e2e8f0; }
    .input, .select, .textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 14px;
      outline: none;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--primary);
      background: #fff;
    }
    .pin-input {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 10px;
      padding: 11px;
    }
    label.lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #0f172a;
      color: #fff;
      padding: 10px 14px;
      border-bottom: 1px solid #1e293b;
    }
    .topbar-inner { max-width: 840px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 25;
      background: #ffffff;
      border-top: 1px solid #cbd5e1;
      display: flex;
      justify-content: space-around;
      padding: 6px 4px;
      box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.06);
    }
    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 2px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-btn.active { color: var(--primary); background: #f0fdfa; }
    .kpi {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
    }
    .kpi-val { font-size: 19px; font-weight: 800; margin-top: 2px; }
    .kpi-lbl { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .pill-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
    }
    .pill.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .student-row {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 11px;
      margin-bottom: 8px;
      background: #fff;
    }
    .student-row.absent { border-color: #fca5a5; background: #fef2f2; }
    .student-row.present { border-color: #a7f3d0; background: #f0fdf4; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.68);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-box {
      background: #fff;
      border-radius: 18px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
    }
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 60;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      max-width: 92vw;
      text-align: center;
    }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .small { font-size: 12px; color: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    pre.msg-box {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 11px;
      font-size: 12.5px;
      font-family: inherit;
      margin: 8px 0;
    }
    .review-list {
      max-height: 210px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 6px;
      background: #f8fafc;
      margin: 8px 0;
    }
    .review-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 9px;
      background: #fff;
      border: 1px solid #e2e8f0;
      margin-bottom: 5px;
      font-size: 12.5px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: #059669;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#334155;padding:20px;text-align:center;">
      <div>
        <div style="font-size:20px;font-weight:800;margin-bottom:6px;">Loading FeePulse Portal...</div>
        <div style="font-size:13px;color:#64748b;">If this screen stays visible, please ensure the entire index.html file was copied completely.</div>
      </div>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toast" class="toast" style="display:none;"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'feepulse_v2_data';
      let memStore = null;

      function readStorage() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return memStore;
        }
      }

      function writeStorage(obj) {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
        } catch (e) {
          memStore = obj;
        }
      }

      function dateStr(offset) {
        const d = new Date();
        d.setDate(d.getDate() + (offset || 0));
        return d.toISOString().split('T')[0];
      }

      const TODAY = dateStr(0);
      const YESTERDAY = dateStr(-1);

                },
                {

                },
                {

                }
              ],
              attendance: {

              },

                ]
              },

            },
            {
              id: 'pragathi-kmm',
              code: 'PRAGATHI',
              name: 'Pragathi IIT & NEET Academy',
              tagline: 'Residential & Day Scholar Campus',
              city: 'Khammam, Telangana',
              phone: '9949011223',
              upiId: 'pragathikmm@ybl',
              pin: '2222',
              status: 'active',
              primaryColor: '#1d4ed8',
              logoUrl: '',
              lang: 'en-te',
              waMode: 'web',
              cloudApi: { phoneNumberId: '', accessToken: '', templateName: '' },
              classes: [
                { id: 'pc1', name: 'NEET Long Term', sections: ['Batch 1'], defaultFee: 3500 }
              ],
              students: [
                {
                  id: 'ps1', rollNo: '01', name: 'Aarav Varma', parent: 'Rajesh Varma', phone: '9848111222',
                  className: 'NEET Long Term', section: 'Batch 1', status: 'active',
                  baseFee: 3500, busFee: 500, examFee: 400, certFee: 0,
                  discountType: 'flat', discountValue: 400, discountReason: 'Early Bird',
                  paidAmount: 2000, dueDate: TODAY, lastReceipt: 'Cash Rs.2000'
                }
              ],

              },
              history: {},
              sentFlags: {}
            }
          ]
        };
      }

      let db = readStorage();
      if (!db || !Array.isArray(db.institutes)) {
        db = buildInitialData();
        writeStorage(db);
      }

      function saveDb() {
        writeStorage(db);
      }

      const urlParams = new URLSearchParams(window.location.search);
      const ui = {
        mode: urlParams.get('admin') === 'true' ? 'admin-gate' : 'login',
        instId: null,
        fromAdmin: false,
        lockTaps: 0,
        tab: 'overview',
        selectedDate: TODAY,
        rcClass: 'ALL',
        rcSection: 'ALL',
        rcSearch: '',
        feeFilter: 'ALL',
        feeSearch: '',
        scenarioType: 'exam',
        scenarioTarget: 'ALL',
        scenarioClass: 'ALL',
        scenarioText: 'Dear {parent}, Exam Fee / Hall Ticket notice for {student} ({class}). Pending due: Rs.{due}. Pay via UPI: {upi} - {inst}',
        revealedPins: {},
        showAdminCreds: false,
        bulkBatch: null
      };

      function toast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
      }

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function cleanPhone(p) {
        const digits = String(p || '').replace(/\D/g, '');
        if (digits.length === 10) return '91' + digits;
        if (digits.length === 12 && digits.startsWith('91')) return digits;
        return digits;
      }

      function calcFee(st) {
        const gross = (Number(st.baseFee) || 0) + (Number(st.busFee) || 0) + (Number(st.examFee) || 0) + (Number(st.certFee) || 0);
        let disc = 0;
        if (st.discountType === 'percent') {
          disc = Math.round((gross * (Number(st.discountValue) || 0)) / 100);
        } else {
          disc = Number(st.discountValue) || 0;
        }
        const net = Math.max(0, gross - disc);
        const paid = Number(st.paidAmount) || 0;
        const due = Math.max(0, net - paid);
        return { gross, disc, net, paid, due };
      }

      function buildWaUrl(inst, phone, text) {
        const num = cleanPhone(phone);
        const encoded = encodeURIComponent(text);
        if (inst.waMode === 'web') {
          return 'https://web.whatsapp.com/send?phone=' + num + '&text=' + encoded;
        }
        return 'https://wa.me/' + num + '?text=' + encoded;
      }

      function buildAbsentMsg(inst, st, dateVal) {
        const en = 'Namaste ' + st.parent + ', your ward ' + st.name + ' (' + st.className + ') is marked ABSENT on ' + dateVal + ' at ' + inst.name + '. Call ' + inst.phone + ' if uninformed.';
        if (inst.lang === 'en-te') {
          return en + '\n\nనమస్కారం ' + st.parent + ', మీ పిల్లవాడు/పిల్ల ' + st.name + ' (' + st.className + ') ఈ రోజు (' + dateVal + ') ' + inst.name + ' కు గైర్హాజరయ్యారు.';
        }
        if (inst.lang === 'en-hi') {
          return en + '\n\nनमस्ते ' + st.parent + ', आपका बच्चा ' + st.name + ' (' + st.className + ') आज (' + dateVal + ') ' + inst.name + ' में अनुपस्थित है।';
        }
        return en;
      }

      function buildFeeMsg(inst, st) {
        const f = calcFee(st);
        const upiLink = 'upi://pay?pa=' + encodeURIComponent(inst.upiId || '') + '&pn=' + encodeURIComponent(inst.name) + '&am=' + f.due + '&cu=INR';
        const en = 'Fee Reminder - ' + inst.name + '\nDear ' + st.parent + ', pending fee for ' + st.name + ' (' + st.className + ') is Rs.' + f.due + ' (Due: ' + (st.dueDate || 'Immediate') + ').\nUPI ID: ' + (inst.upiId || 'At Counter') + '\nTap to Pay: ' + upiLink;
        if (inst.lang === 'en-te') {
          return en + '\n\nఫీజు రిమైండర్: ' + st.name + ' యొక్క బాకీ ఫీజు రూ.' + f.due + '. దయచేసి త్వరగా చెల్లించండి.';
        }
        if (inst.lang === 'en-hi') {
          return en + '\n\nफीस रिमाइंडर: ' + st.name + ' की बकाया फीस रु.' + f.due + ' है। कृपया शीघ्र भुगतान करें।';
        }
        return en;
      }

      function formatScenarioMsg(inst, st, templateStr) {
        const f = calcFee(st);
        return (templateStr || '')
          .replace(/\{student\}/g, st.name)
          .replace(/\{parent\}/g, st.parent)
          .replace(/\{class\}/g, st.className + ' ' + st.section)
          .replace(/\{due\}/g, String(f.due))
          .replace(/\{upi\}/g, inst.upiId || 'At Counter')
          .replace(/\{inst\}/g, inst.name);
      }

      function buildReceiptMsg(inst, st, paidNow, modeStr, noteStr) {
        const f = calcFee(st);
        return 'FEE RECEIPT - ' + inst.name + '\nStudent: ' + st.name + ' (' + st.className + ')\nAmount Paid Now: Rs.' + paidNow + ' (' + modeStr + ')\n' + (noteStr ? 'Ref/Note: ' + noteStr + '\n' : '') + 'Remaining Balance: Rs.' + f.due + '\nThank you!';
      }

      function getCurrentInst() {
        return db.institutes.find(i => i.id === ui.instId) || null;
      }

      function hasCloudApi(inst) {
        return !!(inst && inst.cloudApi && inst.cloudApi.phoneNumberId && inst.cloudApi.accessToken);
      }

      function addHistory(inst, dateVal, type, student, text) {
        if (!inst.history) inst.history = {};
        if (!inst.history[dateVal]) inst.history[dateVal] = [];
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        inst.history[dateVal].unshift({ time, type, student, text });
      }

        const m = document.getElementById('modal');

      function copyText(str, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(str).then(() => toast(label || 'Copied!')).catch(() => fallbackCopy(str, label));
        } else {
          fallbackCopy(str, label);
        }
      }

      function fallbackCopy(str, label) {
        const ta = document.createElement('textarea');
        ta.value = str;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast(label || 'Copied!'); } catch (e) { toast('Copy failed'); }
        document.body.removeChild(ta);
      }

      function buildBulkBatchItems(inst, kind) {
        const d = ui.selectedDate || TODAY;
        const activeStudents = inst.students.filter(s => s.status === 'active');
        let list = [];
        let title = '';

        if (kind === 'absent') {
          const att = (inst.attendance && inst.attendance[d]) || { absentIds: [] };
          list = activeStudents.filter(s => att.absentIds.includes(s.id));
          title = "Today's Absentee Alerts (" + d + ")";
        } else if (kind === 'fee') {
          list = activeStudents.filter(s => calcFee(s).due > 0);
          title = 'Pending Fee Reminders (' + list.length + ' Students)';
        } else if (kind === 'scenario') {
          list = activeStudents.filter(st => {
            if (ui.scenarioClass !== 'ALL' && st.className !== ui.scenarioClass) return false;
            if (ui.scenarioTarget === 'DUE') return calcFee(st).due > 0;
            if (ui.scenarioTarget === 'BUS') return (Number(st.busFee) || 0) > 0;
            if (ui.scenarioTarget === 'EXAM') return (Number(st.examFee) || 0) > 0;
            if (ui.scenarioTarget === 'CERT') return (Number(st.certFee) || 0) > 0;
            return true;
          });
          title = 'Bulk Broadcast (' + ui.scenarioType.toUpperCase() + ')';
        }

        return {
          kind,
          title,
          dateVal: d,
          previewIndex: 0,
          rapidIndex: 0,
          sending: false,
          sentCount: 0,
          failCount: 0,
          items: list.map(st => {
            const f = calcFee(st);
            let msg = '';
            if (kind === 'absent') msg = buildAbsentMsg(inst, st, d);
            else if (kind === 'fee') msg = buildFeeMsg(inst, st);
            else msg = formatScenarioMsg(inst, st, ui.scenarioText);
            return {
              stId: st.id,
              rollNo: st.rollNo,
              name: st.name,
              parent: st.parent,
              phone: st.phone,
              className: st.className,
              due: f.due,
              selected: true,
              status: 'pending', // 'pending' | 'sent' | 'failed'
              msg
            };
          })
        };
      }

      async function dispatchSingleCloudMessage(inst, item) {
        const phoneId = inst.cloudApi.phoneNumberId.trim();
        const token = inst.cloudApi.accessToken.trim();
        const toNum = cleanPhone(item.phone);
        const url = 'https://graph.facebook.com/v21.0/' + encodeURIComponent(phoneId) + '/messages';
        const payload = {
          messaging_product: 'whatsapp',
          recipient_type: 'individual',
          to: toNum,
          type: 'text',
          text: { preview_url: false, body: item.msg }
        };
        const resp = await fetch(url, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          throw new Error((errData.error && errData.error.message) || 'Meta API HTTP ' + resp.status);
        }
        return resp.json();
      }

                  '<option value="en-hi" ' + (inst.lang === 'en-hi' ? 'selected' : '') + '>EN + हिंदी</option>' +

              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="container">' + bodyHtml + '</div>' +
          '<nav class="bottom-nav">' +

            navButton('fees', '₹', 'Fees & Students') +
            navButton('scenarios', '📢', 'Bulk Alerts') +
            navButton('setup', '⚙️', 'Setup & API') +

      function navButton(tabKey, icon, label) {
        return '<button type="button" class="nav-btn ' + (ui.tab === tabKey ? 'active' : '') + '" onclick="FP.setTab(\'' + tabKey + '\')"><span style="font-size:16px;">' + icon + '</span><span>' + label + '</span></button>';
      }

      function renderOverviewTab(inst, activeStudents, phoneCounts) {
        const d = ui.selectedDate || TODAY;
        const att = (inst.attendance && inst.attendance[d]) || { isHoliday: false, holidayReason: '', absentIds: [] };
        const absentStudents = activeStudents.filter(s => att.absentIds.includes(s.id));
        const dueStudents = activeStudents.filter(s => calcFee(s).due > 0);
        const totalDue = dueStudents.reduce((sum, s) => sum + calcFee(s).due, 0);
        const totalCollected = activeStudents.reduce((sum, s) => sum + (Number(s.paidAmount) || 0), 0);
        const dayLogs = (inst.history && inst.history[d]) || [];
        const apiReady = hasCloudApi(inst);

        let absentHtml = '';
        if (att.isHoliday) {
          absentHtml = '<div class="badge badge-amber" style="padding:8px 12px;font-size:12px;">🎉 Holiday Marked (' + esc(att.holidayReason || 'Holiday / Sunday') + ') — Absent Alerts Disabled</div>';
        } else if (absentStudents.length === 0) {
          absentHtml = '<div class="small">No students marked absent on ' + esc(d) + '. Use Roll Call tab to mark absentees.</div>';
        } else {
          absentHtml = absentStudents.map(st => {
            const isSibling = phoneCounts[cleanPhone(st.phone)] > 1;
            const sentKey = d + '_abs_' + st.id;
            const isSent = !!(inst.sentFlags && inst.sentFlags[sentKey]);
            return (
              '<div class="student-row absent">' +
                '<div class="row-between wrap">' +
                  '<div>' +
                    '<div class="row wrap">' +
                      '<strong>#' + esc(st.rollNo) + ' ' + esc(st.name) + '</strong>' +
                      '<span class="badge">' + esc(st.className) + '</span>' +
                      (isSibling ? '<span class="badge badge-blue">Sibling Phone</span>' : '') +
                      (isSent ? '<span class="badge badge-green">Sent ✓</span>' : '') +
                    '</div>' +
                    '<div class="small">Parent: ' + esc(st.parent) + ' • ' + esc(st.phone) + '</div>' +
                  '</div>' +
                  '<div class="row">' +
                    '<button type="button" class="btn btn-outline btn-sm" onclick="FP.previewMsg(\'absent\',\'' + st.id + '\')">👁️ View</button>' +
                    '<a href="' + buildWaUrl(inst, st.phone, buildAbsentMsg(inst, st, d)) + '" target="_blank" rel="noopener noreferrer" onclick="FP.markSent(\'' + sentKey + '\',\'Absent\',\'' + esc(st.name) + '\')" class="btn btn-wa btn-sm">WhatsApp</a>' +
                  '</div>' +
                '</div>' +
              '</div>'
            );
          }).join('');
        }

        let dueHtml = dueStudents.length === 0
          ? '<div class="small">All active students have cleared their fees!</div>'
          : dueStudents.map(st => {
              const f = calcFee(st);
              const sentKey = d + '_fee_' + st.id;
              const isSent = !!(inst.sentFlags && inst.sentFlags[sentKey]);
              return (
                '<div class="student-row">' +
                  '<div class="row-between wrap">' +
                    '<div>' +
                      '<div class="row wrap">' +
                        '<strong>#' + esc(st.rollNo) + ' ' + esc(st.name) + '</strong>' +
                        '<span class="badge badge-red">Due: Rs.' + f.due + '</span>' +
                        (isSent ? '<span class="badge badge-green">Reminded ✓</span>' : '') +
                      '</div>' +
                      '<div class="small">' + esc(st.className) + ' • Parent: ' + esc(st.parent) + ' (' + esc(st.phone) + ')</div>' +
                    '</div>' +
                    '<div class="row">' +
                      '<button type="button" class="btn btn-outline btn-sm" onclick="FP.previewMsg(\'fee\',\'' + st.id + '\')">👁️ View</button>' +
                      '<a href="' + buildWaUrl(inst, st.phone, buildFeeMsg(inst, st)) + '" target="_blank" rel="noopener noreferrer" onclick="FP.markSent(\'' + sentKey + '\',\'Fee\',\'' + esc(st.name) + '\')" class="btn btn-wa btn-sm">WhatsApp</a>' +
                    '</div>' +
                  '</div>' +
                '</div>'
              );
            }).join('');

        let logsHtml = dayLogs.length === 0
          ? '<div class="small">No sent alerts or payment receipts logged on ' + esc(d) + '.</div>'
          : dayLogs.map(item => (
              '<div style="padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:12px;">' +
                '<span class="badge">' + esc(item.time) + '</span> <strong>' + esc(item.student) + '</strong> — ' + esc(item.text) +
              '</div>'
            )).join('');

        return (
          '<div class="card">' +
            '<div class="row-between wrap" style="margin-bottom:10px;">' +
              '<div class="row wrap">' +
                '<button type="button" class="pill ' + (d === TODAY ? 'active' : '') + '" onclick="FP.setDate(\'' + TODAY + '\')">Today</button>' +
                '<button type="button" class="pill ' + (d === YESTERDAY ? 'active' : '') + '" onclick="FP.setDate(\'' + YESTERDAY + '\')">Yesterday</button>' +
                '<input type="date" class="input" style="width:auto;padding:5px 10px;font-size:12px;" value="' + esc(d) + '" onchange="FP.setDate(this.value)" />' +
              '</div>' +
              '<div class="row wrap">' +
                '<span class="badge ' + (apiReady ? 'badge-green' : 'badge-amber') + '">' + (apiReady ? '⚡ Cloud API Ready' : 'Free 1-Tap Mode') + '</span>' +
                '<button type="button" class="btn btn-sm ' + (att.isHoliday ? 'btn-dark' : 'btn-outline') + '" onclick="FP.toggleHoliday()">' +
                  (att.isHoliday ? 'Remove Holiday' : '🎉 Mark Holiday / Sunday') +
                '</button>' +
              '</div>' +
            '</div>' +
            '<div class="grid-3">' +
              '<div class="kpi"><div class="kpi-lbl">Absent (' + esc(d) + ')</div><div class="kpi-val" style="color:#dc2626;">' + (att.isHoliday ? 'Holiday' : absentStudents.length) + '</div></div>' +
              '<div class="kpi"><div class="kpi-lbl">Pending Fee Due</div><div class="kpi-val" style="color:#d97706;">Rs.' + totalDue + '</div></div>' +
              '<div class="kpi"><div class="kpi-lbl">Total Collected</div><div class="kpi-val" style="color:#059669;">Rs.' + totalCollected + '</div></div>' +
            '</div>' +
          '</div>' +

          '<div class="card">' +
            '<div class="row-between wrap" style="margin-bottom:8px;">' +
              '<strong>Absent Alert Queue (' + absentStudents.length + ')</strong>' +
              '<div class="row wrap">' +
                (!att.isHoliday && absentStudents.length > 0 ? '<button type="button" class="btn btn-blast btn-sm" onclick="FP.openBulkReview(\'absent\')">🚀 Review &amp; Bulk Send All (' + absentStudents.length + ')</button>' : '') +
                '<button type="button" class="btn btn-ghost btn-sm" onclick="FP.setTab(\'rollcall\')">Edit Roll Call →</button>' +
              '</div>' +
            '</div>' +
            absentHtml +
          '</div>' +

          '<div class="card">' +
            '<div class="row-between wrap" style="margin-bottom:8px;">' +
              '<strong>Pending Fee Reminders (' + dueStudents.length + ')</strong>' +
              '<div class="row wrap">' +
                (dueStudents.length > 0 ? '<button type="button" class="btn btn-blast btn-sm" onclick="FP.openBulkReview(\'fee\')">🚀 Review &amp; Bulk Send All (' + dueStudents.length + ')</button>' : '') +
                '<button type="button" class="btn btn-ghost btn-sm" onclick="FP.setTab(\'fees\')">Record Payments →</button>' +
              '</div>' +
            '</div>' +
            dueHtml +
          '</div>' +

          '<div class="card">' +
            '<strong>Activity &amp; Receipt History (' + esc(d) + ')</strong>' +
            '<div style="margin-top:6px;">' + logsHtml + '</div>' +
          '</div>'
        );
      }

      function renderRollCallTab(inst, activeStudents, phoneCounts) {
        const d = ui.selectedDate || TODAY;
        const att = (inst.attendance && inst.attendance[d]) || { isHoliday: false, holidayReason: '', absentIds: [] };
        const classes = ['ALL', ...new Set(activeStudents.map(s => s.className))];
        const filteredByClass = ui.rcClass === 'ALL' ? activeStudents : activeStudents.filter(s => s.className === ui.rcClass);
        const sections = ['ALL', ...new Set(filteredByClass.map(s => s.section))];

        const rollTokens = ui.rcSearch.trim().toLowerCase().split(/[\s,]+/).filter(Boolean);
        const list = filteredByClass
          .filter(s => ui.rcSection === 'ALL' || s.section === ui.rcSection)
          .filter(s => {
            if (rollTokens.length === 0) return true;
            return rollTokens.some(tok => s.rollNo.toLowerCase() === tok || s.rollNo.toLowerCase().includes(tok) || s.name.toLowerCase().includes(tok));
          })
          .sort((a, b) => String(a.rollNo).localeCompare(String(b.rollNo), undefined, { numeric: true }));

        return (
          '<div class="card">' +
            '<div class="row-between wrap" style="margin-bottom:8px;">' +
              '<strong>Register Roll Call (' + esc(d) + ')</strong>' +
              '<span class="small">Tap absent students only (others default Present)</span>' +
            '</div>' +
            '<div class="grid-3" style="margin-bottom:10px;">' +
              '<div><label class="lbl">Class / Course</label><select class="select" onchange="FP.setRcFilter(\'rcClass\', this.value)">' +
                classes.map(c => '<option value="' + esc(c) + '" ' + (ui.rcClass === c ? 'selected' : '') + '>' + (c === 'ALL' ? 'All Classes' : esc(c)) + '</option>').join('') +
              '</select></div>' +
              '<div><label class="lbl">Section / Batch</label><select class="select" onchange="FP.setRcFilter(\'rcSection\', this.value)">' +
                sections.map(sec => '<option value="' + esc(sec) + '" ' + (ui.rcSection === sec ? 'selected' : '') + '>' + (sec === 'ALL' ? 'All Sections' : esc(sec)) + '</option>').join('') +
              '</select></div>' +
              '<div><label class="lbl">Quick Roll No. / Name Jump</label><input class="input" value="' + esc(ui.rcSearch) + '" oninput="FP.setRcFilter(\'rcSearch\', this.value)" placeholder="e.g. 101, 103 or Karthik" /></div>' +
            '</div>' +
            list.map(st => {
              const isAbs = att.absentIds.includes(st.id);
              const isSibling = phoneCounts[cleanPhone(st.phone)] > 1;
              return (
                '<div class="student-row ' + (isAbs ? 'absent' : 'present') + '" onclick="FP.toggleAbsent(\'' + st.id + '\')" style="cursor:pointer;">' +
                  '<div class="row-between">' +
                    '<div>' +
                      '<div class="row wrap">' +
                        '<strong>#' + esc(st.rollNo) + ' ' + esc(st.name) + '</strong>' +
                        '<span class="badge">' + esc(st.className) + ' • ' + esc(st.section) + '</span>' +
                        (isSibling ? '<span class="badge badge-blue">Sibling</span>' : '') +
                      '</div>' +
                      '<div class="small">Parent: ' + esc(st.parent) + ' • ' + esc(st.phone) + '</div>' +
                    '</div>' +
                    '<span class="badge ' + (isAbs ? 'badge-red' : 'badge-green') + '" style="font-size:12px;padding:5px 10px;">' +
                      (isAbs ? 'ABSENT' : 'PRESENT') +
                    '</span>' +
                  '</div>' +
                '</div>'
              );
            }).join('') +
            '<div class="grid-2" style="margin-top:8px;">' +
              '<button type="button" class="btn btn-outline" onclick="FP.saveRollCallAndGo()">Save Roll Call Only</button>' +
              '<button type="button" class="btn btn-blast" onclick="FP.saveRollCallAndReview()">🚀 Save &amp; Review Bulk Send (' + att.absentIds.length + ')</button>' +
            '</div>' +
          '</div>'
        );
      }

      function renderFeesTab(inst, phoneCounts) {
        const list = inst.students
          .filter(st => {
            const f = calcFee(st);
            if (ui.feeFilter === 'LEFT') return st.status === 'left';
            if (st.status === 'left') return false;
            if (ui.feeFilter === 'DUE') return f.due > 0;
            if (ui.feeFilter === 'PAID') return f.due === 0;
            return true;
          })
          .filter(st => {
            const q = ui.feeSearch.trim().toLowerCase();
            if (!q) return true;
            return st.name.toLowerCase().includes(q) || st.rollNo.toLowerCase().includes(q) || st.phone.includes(q) || st.className.toLowerCase().includes(q);
          });

        return (
          '<div class="card">' +
            '<div class="row-between wrap" style="margin-bottom:8px;">' +
              '<strong>Student Fee Structures &amp; Ledger</strong>' +
              '<div class="row wrap">' +
                '<button type="button" class="btn btn-blast btn-sm" onclick="FP.openBulkReview(\'fee\')">🚀 Bulk Fee Reminders</button>' +
                '<button type="button" class="btn btn-primary btn-sm" onclick="FP.openStudentModal(null)">+ Add Student</button>' +
              '</div>' +
            '</div>' +
            '<div class="row-between wrap" style="margin-bottom:10px;">' +
              '<div class="pill-tabs">' +
                ['ALL', 'DUE', 'PAID', 'LEFT'].map(k => '<button type="button" class="pill ' + (ui.feeFilter === k ? 'active' : '') + '" onclick="FP.setFeeFilter(\'' + k + '\')">' + k + '</button>').join('') +
              '</div>' +
              '<input class="input" style="max-width:240px;padding:7px 10px;font-size:13px;" value="' + esc(ui.feeSearch) + '" oninput="FP.setFeeSearch(this.value)" placeholder="Search name, roll, phone..." />' +
            '</div>' +
            list.map(st => {
              const f = calcFee(st);
              const isSibling = phoneCounts[cleanPhone(st.phone)] > 1;
              return (
                '<div class="student-row">' +
                  '<div class="row-between wrap" style="margin-bottom:6px;">' +
                    '<div>' +
                      '<div class="row wrap">' +
                        '<strong>#' + esc(st.rollNo) + ' ' + esc(st.name) + '</strong>' +
                        '<span class="badge">' + esc(st.className) + ' (' + esc(st.section) + ')</span>' +
                        (isSibling ? '<span class="badge badge-blue">Sibling</span>' : '') +
                        (st.status === 'left' ? '<span class="badge badge-red">Left Institute</span>' : '') +
                      '</div>' +
                      '<div class="small">Parent: ' + esc(st.parent) + ' • ' + esc(st.phone) + (st.lastReceipt ? ' • Last: ' + esc(st.lastReceipt) : '') + '</div>' +
                    '</div>' +
                    '<div style="text-align:right;">' +
                      '<span class="badge ' + (f.due > 0 ? 'badge-red' : 'badge-green') + '" style="font-size:12px;">' + (f.due > 0 ? 'Due: Rs.' + f.due : 'Paid Full ✓') + '</span>' +
                    '</div>' +
                  '</div>' +
                  '<div class="small" style="background:#f8fafc;padding:6px 8px;border-radius:8px;margin-bottom:8px;">' +
                    'Tuition: Rs.' + st.baseFee +
                    (st.busFee ? ' + Bus: Rs.' + st.busFee : '') +
                    (st.examFee ? ' + Exam: Rs.' + st.examFee : '') +
                    (st.certFee ? ' + Cert: Rs.' + st.certFee : '') +
                    (f.disc ? ' − Scholarship/Disc: Rs.' + f.disc : '') +
                    ' = <strong>Net: Rs.' + f.net + '</strong> | Paid: Rs.' + f.paid +
                  '</div>' +
                  '<div class="row wrap">' +
                    '<button type="button" class="btn btn-primary btn-sm" onclick="FP.openPayModal(\'' + st.id + '\')">₹ Pay / Receipt</button>' +
                    '<button type="button" class="btn btn-outline btn-sm" onclick="FP.previewMsg(\'fee\',\'' + st.id + '\')">👁️ View</button>' +
                    '<a href="' + buildWaUrl(inst, st.phone, buildFeeMsg(inst, st)) + '" target="_blank" rel="noopener noreferrer" class="btn btn-wa btn-sm">WhatsApp</a>' +
                    '<button type="button" class="btn btn-ghost btn-sm" onclick="FP.openStudentModal(\'' + st.id + '\')">Edit Fees</button>' +
                    '<button type="button" class="btn btn-ghost btn-sm" onclick="FP.toggleStudentLeft(\'' + st.id + '\')">' + (st.status === 'left' ? 'Re-Activate' : 'Mark Left') + '</button>' +
                  '</div>' +
                '</div>'
              );
            }).join('') +
          '</div>'
        );
      }

      function renderScenariosTab(inst, activeStudents) {
        const classes = ['ALL', ...new Set(activeStudents.map(s => s.className))];
        const targets = activeStudents.filter(st => {
          if (ui.scenarioClass !== 'ALL' && st.className !== ui.scenarioClass) return false;
          if (ui.scenarioTarget === 'DUE') return calcFee(st).due > 0;
          if (ui.scenarioTarget === 'BUS') return (Number(st.busFee) || 0) > 0;
          if (ui.scenarioTarget === 'EXAM') return (Number(st.examFee) || 0) > 0;
          if (ui.scenarioTarget === 'CERT') return (Number(st.certFee) || 0) > 0;
          return true;
        });

        return (
          '<div class="card">' +
            '<div class="row-between wrap" style="margin-bottom:8px;">' +
              '<strong>Whole-Strength &amp; Scenario Bulk Messaging</strong>' +
              '<span class="badge ' + (hasCloudApi(inst) ? 'badge-green' : 'badge-blue') + '">' + (hasCloudApi(inst) ? '⚡ Cloud API Ready' : 'Mode: ' + esc(inst.waMode.toUpperCase())) + '</span>' +
            '</div>' +
            '<div class="pill-tabs" style="margin-bottom:8px;">' +
              [
                ['exam', 'Exam Fee / Hall Ticket'],
                ['bus', 'Bus Route / Timing'],
                ['cert', 'Certificate / TC'],
                ['holiday', 'Holiday / PTM'],
                ['custom', 'Custom Notice']
              ].map(([k, lbl]) => '<button type="button" class="pill ' + (ui.scenarioType === k ? 'active' : '') + '" onclick="FP.pickScenario(\'' + k + '\')">' + lbl + '</button>').join('') +
            '</div>' +
            '<div class="grid-2" style="margin-bottom:8px;">' +
              '<div><label class="lbl">Target Audience</label><select class="select" onchange="FP.setScenarioFilter(\'scenarioTarget\', this.value)">' +
                '<option value="ALL" ' + (ui.scenarioTarget === 'ALL' ? 'selected' : '') + '>Whole Strength (All Active Students)</option>' +
                '<option value="DUE" ' + (ui.scenarioTarget === 'DUE' ? 'selected' : '') + '>Fee Due Students Only</option>' +
                '<option value="BUS" ' + (ui.scenarioTarget === 'BUS' ? 'selected' : '') + '>Bus Fee Students Only</option>' +
                '<option value="EXAM" ' + (ui.scenarioTarget === 'EXAM' ? 'selected' : '') + '>Exam Fee Students Only</option>' +
                '<option value="CERT" ' + (ui.scenarioTarget === 'CERT' ? 'selected' : '') + '>Certificate Fee Students Only</option>' +
              '</select></div>' +
              '<div><label class="lbl">Class Filter</label><select class="select" onchange="FP.setScenarioFilter(\'scenarioClass\', this.value)">' +
                classes.map(c => '<option value="' + esc(c) + '" ' + (ui.scenarioClass === c ? 'selected' : '') + '>' + (c === 'ALL' ? 'All Classes' : esc(c)) + '</option>').join('') +
              '</select></div>' +
            '</div>' +
            '<label class="lbl">Message Template (Variables: {student}, {parent}, {class}, {due}, {upi}, {inst})</label>' +
            '<textarea class="textarea" rows="3" oninput="FP.updateScenarioText(this.value)">' + esc(ui.scenarioText) + '</textarea>' +
            '<button type="button" class="btn btn-blast btn-block" style="margin-top:10px;padding:11px;" onclick="FP.openBulkReview(\'scenario\')">🚀 Review &amp; Bulk Send to Selected Strength (' + targets.length + ' Students)</button>' +
          '</div>' +

          '<div class="card">' +
            '<div class="row-between wrap" style="margin-bottom:8px;">' +
              '<strong>Matched Recipients (' + targets.length + ' Students)</strong>' +
              '<span class="small">Click button above to review checklist &amp; send in 1 click</span>' +
            '</div>' +
            targets.map(st => {
              const msg = formatScenarioMsg(inst, st, ui.scenarioText);
              return (
                '<div class="student-row">' +
                  '<div class="row-between wrap">' +
                    '<div><strong>#' + esc(st.rollNo) + ' ' + esc(st.name) + '</strong> <span class="badge">' + esc(st.className) + '</span><div class="small">' + esc(st.parent) + ' • ' + esc(st.phone) + '</div></div>' +
                    '<div class="row">' +
                      '<button type="button" class="btn btn-outline btn-sm" onclick="FP.previewCustomMsg(\'' + esc(st.name) + '\',\'' + esc(st.phone) + '\',' + JSON.stringify(msg) + ')">👁️ View</button>' +
                      '<a href="' + buildWaUrl(inst, st.phone, msg) + '" target="_blank" rel="noopener noreferrer" class="btn btn-wa btn-sm">WhatsApp</a>' +
                    '</div>' +
                  '</div>' +
                '</div>'
              );
            }).join('') +
          '</div>'
        );
      }

      function renderSetupTab(inst) {
        return (
          '<div class="card">' +
            '<strong>White-Label Institute Branding &amp; PIN</strong>' +
            '<form onsubmit="FP.saveBranding(event)" style="margin-top:8px;">' +
              '<div class="grid-2" style="margin-bottom:8px;">' +

              '<div class="grid-3" style="margin-bottom:8px;">' +

                '<div><label class="lbl">Upload Logo Image</label><input type="file" accept="image/*" class="input" style="padding:7px;" onchange="FP.uploadLogo(event)" /></div>' +
              '</div>' +
              '<button type="submit" class="btn btn-primary btn-sm">Save Branding &amp; Settings</button>' +
            '</form>' +
          '</div>' +

          '<div class="card">' +

          const inst = getCurrentInst();
          const b = ui.bulkBatch;
          if (!inst || !b) return;
          const selected = b.items.filter(i => i.selected);
          const cur = selected[b.rapidIndex];
          if (cur) {
            cur.status = 'sent';
            b.sentCount++;
            if (!inst.sentFlags) inst.sentFlags = {};
            const prefix = b.kind === 'absent' ? '_abs_' : (b.kind === 'fee' ? '_fee_' : '_blk_');
            inst.sentFlags[b.dateVal + prefix + cur.stId] = true;
            addHistory(inst, b.dateVal, b.kind.toUpperCase(), cur.name, 'Bulk queue WhatsApp opened');
            saveDb();
          }
          b.rapidIndex++;
          setTimeout(() => { render(); renderBulkReviewModal(); }, 250);

        async executeCloudBlast() {
          const inst = getCurrentInst();
          const b = ui.bulkBatch;
          if (!inst || !b || !hasCloudApi(inst)) return;
          const selected = b.items.filter(i => i.selected);
          if (selected.length === 0) return;

          b.sending = true;
          b.sentCount = 0;
          b.failCount = 0;
          renderBulkReviewModal();

          for (let i = 0; i < selected.length; i++) {
            const item = selected[i];
            try {
              await dispatchSingleCloudMessage(inst, item);
              item.status = 'sent';
              b.sentCount++;
              if (!inst.sentFlags) inst.sentFlags = {};
              const prefix = b.kind === 'absent' ? '_abs_' : (b.kind === 'fee' ? '_fee_' : '_blk_');
              inst.sentFlags[b.dateVal + prefix + item.stId] = true;
              addHistory(inst, b.dateVal, 'CloudAPI', item.name, 'Bulk ' + b.kind + ' sent via Cloud API');
            } catch (err) {
              item.status = 'failed';
              b.failCount++;
            }
            renderBulkReviewModal();
          }

          b.sending = false;
          saveDb();
          render();
          renderBulkReviewModal();
          toast('Cloud API Blast finished: ' + b.sentCount + ' sent' + (b.failCount ? ', ' + b.failCount + ' failed' : ''));

          const st = inst.students.find(s => s.id === stId);
          if (!st) return;
          const amt = Number(document.getElementById('payAmt').value) || 0;
          const mode = document.getElementById('payMode').value;
          const note = document.getElementById('payNote').value.trim();
          st.paidAmount = (Number(st.paidAmount) || 0) + amt;
          st.dueDate = document.getElementById('payNextDue').value || st.dueDate;
          st.lastReceipt = mode + ' Rs.' + amt + (note ? ' (' + note + ')' : '');
          const recText = buildReceiptMsg(inst, st, amt, mode, note);
          addHistory(inst, TODAY, 'Paid', st.name, 'Paid Rs.' + amt + ' via ' + mode);
          saveDb();
          render();
          this.previewCustomMsg(st.name + ' Receipt', st.phone, recText);
        },
        pickScenario(k) {
          ui.scenarioType = k;
          const presets = {
            exam: 'Dear {parent}, Exam Fee / Hall Ticket notice for {student} ({class}). Pending due: Rs.{due}. Pay via UPI: {upi} - {inst}',
            bus: 'Bus Alert - {inst}: Dear {parent}, transport timing/route update for {student} ({class}). Please be at the stop 10 mins early.',
            cert: 'Certificate Notice - {inst}: Dear {parent}, Bonafide / TC / ID certificate update for {student} ({class}). Pending due: Rs.{due}.',
            holiday: 'Holiday / PTM Notice - {inst}: Dear {parent}, institute update for {student} ({class}). Contact office for details.',
            custom: 'Notice from {inst}: Dear {parent}, update regarding {student} ({class}).'
          };
          ui.scenarioText = presets[k] || presets.custom;
          render();
        },
        setScenarioFilter(k, v) { ui[k] = v; render(); },
        updateScenarioText(v) { ui.scenarioText = v; },
        saveBranding(e) {
          e.preventDefault();
          const inst = getCurrentInst();
          inst.name = document.getElementById('setInstName').value.trim();
          inst.tagline = document.getElementById('setInstTagline').value.trim();
          inst.city = document.getElementById('setInstCity').value.trim();
          inst.phone = document.getElementById('setInstPhone').value.trim();
          inst.upiId = document.getElementById('setInstUpi').value.trim();
          inst.primaryColor = document.getElementById('setInstColor').value;
          const pin = document.getElementById('setInstPin').value.trim();
          if (/^\d{4}$/.test(pin)) inst.pin = pin;
          saveDb();
          toast('Institute branding updated!');
          render();
        },
        uploadLogo(ev) {
          const file = ev.target.files && ev.target.files[0];
          const inst = getCurrentInst();
          if (!file || !inst) return;
          const r = new FileReader();
          r.onload = () => {
            inst.logoUrl = r.result;
            saveDb();
            toast('Logo uploaded!');
            render();
          };
          r.readAsDataURL(file);
        },
        setWaMode(m) {
          const inst = getCurrentInst();
          if (inst) { inst.waMode = m; saveDb(); render(); }
        },
        saveCloudApi(e) {
          e.preventDefault();
          const inst = getCurrentInst();
          inst.cloudApi = {
            phoneNumberId: document.getElementById('apiPhoneId').value.trim(),
            accessToken: document.getElementById('apiToken').value.trim(),
            templateName: ''
          };
          if (hasCloudApi(inst)) inst.waMode = 'cloud';
          saveDb();
          toast('Cloud API keys saved! 1-Click Bulk Blast enabled.');
          render();
        },
        importCsvRows(mode) {
          const inst = getCurrentInst();
          const raw = (document.getElementById('csvPasteBox').value || '').trim();
          if (!raw) { toast('Paste CSV rows first.'); return; }
          const lines = raw.split(/\r?\n/).filter(Boolean);
          let count = 0;
          lines.forEach(line => {
            const cols = line.split(',').map(c => c.trim());
            if (cols.length < 4 || cols[0].toLowerCase() === 'rollno') return;
            const rollNo = cols[0];
            const name = cols[1];
            const parent = cols[2] || 'Parent';
            const phone = cols[3];
            const className = cols[4] || 'General';
            const section = cols[5] || 'A';
            const baseFee = Number(cols[6]) || 0;
            const busFee = Number(cols[7]) || 0;
            const examFee = Number(cols[8]) || 0;
            const certFee = Number(cols[9]) || 0;
            const discountValue = Number(cols[10]) || 0;
            const paidAmount = Number(cols[11]) || 0;
            const dueDate = cols[12] || TODAY;

            const existing = inst.students.find(s => s.rollNo === rollNo && cleanPhone(s.phone) === cleanPhone(phone));
            if (existing && mode === 'update') {
              Object.assign(existing, { baseFee, busFee, examFee, certFee, discountValue, paidAmount, dueDate, className, section });
              count++;
            } else if (!existing) {
              inst.students.push({
                id: 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
                rollNo, name, parent, phone, className, section, status: 'active',
                baseFee, busFee, examFee, certFee, discountType: 'flat', discountValue, discountReason: '',
                paidAmount, dueDate, lastReceipt: ''
              });
              count++;
            }
          });
          saveDb();
          toast('Processed ' + count + ' student rows!');
          render();
        },
        exportCsv() {
          const inst = getCurrentInst();
          const header = 'RollNo,Name,Parent,Phone,Class,Section,TuitionFee,BusFee,ExamFee,CertFee,Discount,Paid,Due,DueDate,Status';
          const rows = inst.students.map(s => {
            const f = calcFee(s);
            return [s.rollNo, s.name, s.parent, s.phone, s.className, s.section, s.baseFee, s.busFee, s.examFee, s.certFee, f.disc, s.paidAmount, f.due, s.dueDate, s.status].join(',');
          });
          const blob = new Blob([[header, ...rows].join('\n')], { type: 'text/csv' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = inst.code.toLowerCase() + '-students-' + TODAY + '.csv';
          a.click();
        },
        exportInstJson() {
          const inst = getCurrentInst();
          const blob = new Blob([JSON.stringify(inst, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = inst.code.toLowerCase() + '-backup-' + TODAY + '.json';
          a.click();
        }
      };

      document.addEventListener('keydown', function (e) {
        if (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')) {
          e.preventDefault();
          ui.mode = 'admin-gate';
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
